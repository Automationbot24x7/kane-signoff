name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: Signoff has no dependencies.
      # The gate tests start a real app and run the whole loop with a stand-in for Kane CLI
      # (test-support/fake-kane.mjs); runs with the real Kane CLI are logged in docs/runs/.
      - run: npm test
